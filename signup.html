<!DOCTYPE html>
<html>

<head>
    Signup
</head>

<body>
    <h2> Sign Up</h2>

    <form>
        <label>Full Name: </label><br />
        <input type="text" name="fullname" readonly /> <br /> <br />

        <label>Email: </label><br />
        <input type="email" name="email" readonly /> <br /> <br />

        <label>Password: </label><br />
        <input type="password" name="password" readonly /> <br /> <br />

        <label>Confirm Password: </label><br />
        <input type="password" name="confirm_password" readonly /> <br /> <br />

        <button type="submit">Login</button>
    </form>
</body>

</html>
